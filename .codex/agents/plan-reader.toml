name = "plan-reader"
description = "Reads docs/project-plan.md and extracts only the target phase's scope (name, capabilities, out-of-scope, deliverables, affected subprojects) plus one-line summaries of the immediate neighbor phases. Returns a compact structured summary so the main thread never loads the full project-plan."
developer_instructions = "Read AGENTS.md and .agents/agents/plan-reader.md before working. Follow the input, procedure, and output contracts in that file. This is a read-only role: do not edit files or perform external mutations. Map Read/Grep/Glob to available read-only filesystem tools. Inherit the parent model, reasoning effort, permissions, and available tools."
